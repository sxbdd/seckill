<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒杀商城</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <div class="brand">⚡ 秒杀商城</div>
            <nav class="tabs">
                <button class="tab active" data-tab="home">抢购现场</button>
                <button class="tab" data-tab="orders">我的订单</button>
                <button class="tab hidden" id="adminTab" data-tab="admin">管理后台</button>
            </nav>
            <div class="auth-area">
                <span id="userBadge" class="user-badge hidden"></span>
                <button id="loginBtn" class="btn btn-ghost">登录</button>
                <button id="registerBtn" class="btn btn-primary">注册</button>
                <button id="logoutBtn" class="btn btn-ghost hidden">退出</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>限时低价，手慢无</h1>
            <p>抢购现场 · 实时库存 · 高并发秒杀体验</p>
        </div>
    </section>

    <main class="container">
        <section id="home" class="view active">
            <div class="section-title"><h2>进行中的活动</h2><span id="activityRefresh">刷新</span></div>
            <div id="activityGrid" class="activity-grid"></div>
            <div id="activityEmpty" class="empty hidden">暂无进行中或即将开始的活动</div>
        </section>

        <section id="orders" class="view">
            <div class="section-title"><h2>我的订单</h2><span id="orderRefresh">刷新</span></div>
            <div id="orderList" class="order-list"></div>
            <div id="orderEmpty" class="empty hidden">还没有订单，快去抢一件吧</div>
        </section>

        <section id="admin" class="view">
            <div class="admin-grid">
                <div class="card">
                    <h3>创建秒杀活动</h3>
                    <form id="activityForm">
                        <label>商品 ID
                            <input type="number" id="f_goodsId" value="1" min="1" required>
                        </label>
                        <label>秒杀价
                            <input type="number" id="f_price" value="99" step="0.01" min="0.01" required>
                        </label>
                        <label>开始时间
                            <input type="datetime-local" id="f_start" required>
                        </label>
                        <label>结束时间
                            <input type="datetime-local" id="f_end" required>
                        </label>
                        <label>库存
                            <input type="number" id="f_stock" value="100" min="1" max="100000" required>
                        </label>
                        <button type="submit" class="btn btn-primary btn-block">创建活动</button>
                    </form>
                </div>
                <div class="card">
                    <h3>全部活动</h3>
                    <div id="adminList" class="admin-list"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="modal" class="modal hidden">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">×</button>
            <h3 id="modalTitle">登录</h3>
            <form id="authForm">
                <label id="nicknameField" class="hidden">昵称
                    <input type="text" id="authNickname" maxlength="50">
                </label>
                <label>用户名
                    <input type="text" id="authUsername" minlength="4" maxlength="50" required>
                </label>
                <label>密码
                    <input type="password" id="authPassword" minlength="8" required>
                </label>
                <button type="submit" class="btn btn-primary btn-block" id="authSubmit">登录</button>
            </form>
        </div>
    </div>

    <div id="toastBox" class="toast-box"></div>

    <script src="/js/app.js"></script>
</body>
</html>
